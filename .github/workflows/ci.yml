name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Check the core has no runtime dependencies
        run: python -c "import importlib.metadata as m; assert not m.requires('agentdream') or all('extra ==' in r for r in m.requires('agentdream')), m.requires('agentdream')"
      - name: Test
        run: python -m pytest -q
      - name: Run the example
        run: python examples/run_example.py > /dev/null
