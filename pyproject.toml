[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "agentdream"
version = "0.1.0"
description = "Local-first sleep-time memory consolidation (\"dreaming\") for any agent and any model."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "systemagents-ai" }]
keywords = ["agents", "memory", "llm", "consolidation", "dreaming", "sleep-time-compute", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# The core is stdlib-only on purpose.
dependencies = []

[project.optional-dependencies]
# All built-in LLM backends use urllib / subprocess, so no SDK extra is needed.
# The stancelog adapter is optional and imported lazily. stancelog is not on PyPI, and PyPI rejects
# direct-URL dependencies, so install it yourself: pip install "git+https://github.com/systemagents-ai/stancelog"
dev = ["pytest>=7", "pytest-cov>=4", "coverage[toml]>=7", "ruff>=0.6", "mypy>=1.10", "hypothesis>=6.100"]

[project.scripts]
agentdream = "agentdream.cli:main"

[project.urls]
Homepage = "https://github.com/mvplab-ai/agentdream"
Repository = "https://github.com/mvplab-ai/agentdream"
Documentation = "https://github.com/mvplab-ai/agentdream#60-second-quickstart"
Issues = "https://github.com/mvplab-ai/agentdream/issues"
Changelog = "https://github.com/mvplab-ai/agentdream/releases"

[tool.hatch.build.targets.wheel]
packages = ["src/agentdream"]

[tool.hatch.build.targets.sdist]
include = ["src/agentdream", "tests", "examples", "docs", "scripts", "README.md", "LICENSE", "CONTRIBUTING.md", "CODE_OF_CONDUCT.md", "SECURITY.md", "SPEC.md"]
exclude = [".hypothesis", ".hypothesis/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: hits a real model (claude-cli); skipped unless AGENTDREAM_LIVE=1",
    "edge(area): edge-case suite under tests/edge (applied automatically; see docs/EDGE_CASES.md)",
]

[tool.coverage.run]
source = ["agentdream"]
branch = false

[tool.coverage.report]
# measured ~97% locally (3.13 + stancelog); a margin for platform-specific branches
fail_under = 94
show_missing = true
skip_covered = false
exclude_also = [
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@overload",
]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF"]
ignore = [
    # `"a b c".split()` word lists read better than 200-item list literals.
    "SIM905",
    # The text heuristics deliberately handle typographic quotes, arrows and dashes.
    "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# tests import helpers from conftest after pytest.importorskip(...)
"tests/*" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["agentdream"]
known-local-folder = ["conftest", "synth", "edgekit"]

[tool.mypy]
python_version = "3.10"
files = ["src/agentdream"]
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true
warn_return_any = false
disallow_incomplete_defs = true
show_error_codes = true

[[tool.mypy.overrides]]
# Python 3.10 fallback for tomllib; optional
module = ["tomli"]
ignore_missing_imports = true
